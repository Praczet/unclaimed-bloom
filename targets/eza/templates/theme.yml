# Generated by Unclaimed Bloom / spore.
# Do not edit this file directly unless you enjoy losing arguments with automation.
# eza reads ~/.config/eza/theme.yml; EZA_COLORS / LS_COLORS would override it.

colourful: true

filekinds:
  normal:       { foreground: "{{fg}}" }
  directory:    { foreground: "{{command}}", is_bold: true }
  symlink:      { foreground: "{{builtin}}" }
  pipe:         { foreground: "{{warning}}" }
  block_device: { foreground: "{{warning}}", is_bold: true }
  char_device:  { foreground: "{{warning}}", is_bold: true }
  socket:       { foreground: "{{keyword}}", is_bold: true }
  special:      { foreground: "{{keyword}}" }
  executable:   { foreground: "{{success}}", is_bold: true }
  mount_point:  { foreground: "{{command}}", is_bold: true, is_underline: true }

perms:
  user_read:          { foreground: "{{warning}}", is_bold: true }
  user_write:         { foreground: "{{danger}}", is_bold: true }
  user_execute_file:  { foreground: "{{success}}", is_bold: true }
  user_execute_other: { foreground: "{{success}}", is_bold: true }
  group_read:         { foreground: "{{warning}}" }
  group_write:        { foreground: "{{danger}}" }
  group_execute:      { foreground: "{{success}}" }
  other_read:         { foreground: "{{warning}}" }
  other_write:        { foreground: "{{danger}}" }
  other_execute:      { foreground: "{{success}}" }
  special_user_file:  { foreground: "{{keyword}}" }
  special_other:      { foreground: "{{keyword}}" }
  attribute:          { foreground: "{{muted}}" }

size:
  major:       { foreground: "{{success}}", is_bold: true }
  minor:       { foreground: "{{success}}" }
  number_byte: { foreground: "{{fg_dim}}" }
  number_kilo: { foreground: "{{success}}" }
  number_mega: { foreground: "{{warning}}" }
  number_giga: { foreground: "{{escape}}" }
  number_huge: { foreground: "{{danger}}" }
  unit_byte:   { foreground: "{{muted}}" }
  unit_kilo:   { foreground: "{{muted}}" }
  unit_mega:   { foreground: "{{muted}}" }
  unit_giga:   { foreground: "{{muted}}" }
  unit_huge:   { foreground: "{{muted}}" }

users:
  user_you:    { foreground: "{{warning}}", is_bold: true }
  user_root:   { foreground: "{{danger}}", is_bold: true }
  user_other:  { foreground: "{{fg_dim}}" }
  group_yours: { foreground: "{{warning}}" }
  group_other: { foreground: "{{fg_dim}}" }
  group_root:  { foreground: "{{danger}}" }

links:
  normal:          { foreground: "{{keyword}}" }
  multi_link_file: { foreground: "{{keyword}}", is_bold: true }

git:
  new:        { foreground: "{{success}}" }
  modified:   { foreground: "{{warning}}" }
  deleted:    { foreground: "{{danger}}" }
  renamed:    { foreground: "{{keyword}}" }
  typechange: { foreground: "{{keyword}}" }
  ignored:    { foreground: "{{muted}}" }
  conflicted: { foreground: "{{danger}}", is_bold: true }

git_repo:
  branch_main:  { foreground: "{{success}}" }
  branch_other: { foreground: "{{keyword}}" }
  git_clean:    { foreground: "{{success}}" }
  git_dirty:    { foreground: "{{warning}}" }

file_type:
  image:      { foreground: "{{path}}" }
  video:      { foreground: "{{keyword}}" }
  music:      { foreground: "{{alias}}" }
  lossless:   { foreground: "{{alias}}", is_bold: true }
  crypto:     { foreground: "{{success}}" }
  document:   { foreground: "{{option}}" }
  compressed: { foreground: "{{danger}}" }
  temp:       { foreground: "{{muted}}" }
  compiled:   { foreground: "{{muted}}" }
  build:      { foreground: "{{warning}}", is_underline: true }
  source:     { foreground: "{{fg}}" }

punctuation:         { foreground: "{{border}}" }
date:                { foreground: "{{option}}" }
inode:               { foreground: "{{keyword}}" }
blocks:              { foreground: "{{muted}}" }
header:              { foreground: "{{fg}}", is_underline: true }
octal:               { foreground: "{{keyword}}" }
flags:               { foreground: "{{muted}}" }
symlink_path:        { foreground: "{{builtin}}" }
control_char:        { foreground: "{{danger}}" }
broken_symlink:      { foreground: "{{danger}}" }
broken_path_overlay: { is_underline: true }
