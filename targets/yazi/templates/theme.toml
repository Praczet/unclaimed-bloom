# Generated by Unclaimed Bloom / spore.
# Do not edit this file directly unless you enjoy losing arguments with automation.
# Section layout follows the yazi 26.9 preset (theme-dark.toml).


# : Manager [[[

[mgr]
cwd = { fg = "{{info}}" }

# Find
find_keyword  = { fg = "{{warning}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{secondary}}", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { fg = "{{muted}}", italic = true }

# Markers
marker_copied   = { fg = "{{success}}",     bg = "{{success}}" }
marker_cut      = { fg = "{{error}}",       bg = "{{error}}" }
marker_marked   = { fg = "{{copy_marker}}", bg = "{{copy_marker}}" }
marker_selected = { fg = "{{tertiary}}",    bg = "{{tertiary}}" }
marker_symbol   = "│"

# Count badges
count_copied   = { fg = "{{on_primary}}",  bg = "{{success}}" }
count_cut      = { fg = "{{on_primary}}",  bg = "{{error}}" }
count_selected = { fg = "{{on_tertiary}}", bg = "{{tertiary}}" }

# Border
border_symbol = " "
border_style  = { fg = "{{accent}}" }

# Code previews use the bat spore
syntect_theme = "~/.config/bat/themes/unclaimed-bloom.tmTheme"

# : ]]]


# : Tabs [[[

[tabs]
active   = { fg = "{{on_primary}}", bg = "{{primary}}", bold = true }
inactive = { fg = "{{primary}}",    bg = "{{surface_variant}}" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : ]]]


# : Mode [[[

[mode]
normal_main = { fg = "{{on_primary}}",         bg = "{{primary}}",         bold = true }
normal_alt  = { fg = "{{on_surface_variant}}", bg = "{{surface_variant}}" }

select_main = { fg = "{{on_secondary}}",       bg = "{{secondary}}",       bold = true }
select_alt  = { fg = "{{on_surface_variant}}", bg = "{{surface_variant}}" }

unset_main  = { fg = "{{on_tertiary}}",        bg = "{{tertiary}}",        bold = true }
unset_alt   = { fg = "{{on_surface_variant}}", bg = "{{surface_variant}}" }

# : ]]]


# : Indicator of hovered file [[[

[indicator]
parent  = { fg = "{{on_surface}}", bg = "{{surface_hi}}" }
current = { fg = "{{on_surface}}", bg = "{{surface_hi}}", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : ]]]


# : Status bar [[[

[status]
overall   = { bg = "{{surface_variant}}" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "{{muted}}" }
perm_type  = { fg = "{{primary}}" }
perm_read  = { fg = "{{perm_r}}" }
perm_write = { fg = "{{perm_w}}" }
perm_exec  = { fg = "{{perm_x}}" }

# Progress
progress_label  = { fg = "{{on_surface}}", bold = true }
progress_normal = { fg = "{{primary}}",    bg = "{{surface_hi}}" }
progress_error  = { fg = "{{error}}",      bg = "{{surface_hi}}" }

# : ]]]


# : Which [[[

[which]
border          = { fg = "{{primary}}" }
cols            = 3
mask            = { bg = "{{surface_hi}}" }
cand            = { fg = "{{primary}}" }
rest            = { fg = "{{on_surface_variant}}" }
desc            = { fg = "{{on_surface}}" }
separator       = " ▶ "
separator_style = { fg = "{{on_surface_variant}}" }

# : ]]]


# : Confirmation [[[

[confirm]
border     = { fg = "{{primary}}" }
title      = { fg = "{{primary}}", bold = true }
body       = { fg = "{{on_surface}}" }
list       = { fg = "{{on_surface_variant}}" }
btn_yes    = { fg = "{{on_primary}}", bg = "{{primary}}", bold = true }
btn_no     = { fg = "{{on_surface_variant}}" }
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# : ]]]


# : Spotter [[[

[spot]
border = { fg = "{{primary}}" }
title  = { fg = "{{primary}}", bold = true }

# Table
tbl_col  = { fg = "{{primary}}" }
tbl_cell = { fg = "{{on_primary}}", bg = "{{warning}}" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "{{success}}" }
title_warn  = { fg = "{{warning}}" }
title_error = { fg = "{{error}}" }

# : ]]]


# : Picker [[[

[pick]
border   = { fg = "{{primary}}" }
active   = { fg = "{{tertiary}}", bold = true }
inactive = { fg = "{{on_surface}}" }

# : ]]]


# : Input [[[

[input]
border   = { fg = "{{primary}}" }
title    = { fg = "{{primary}}" }
value    = { fg = "{{on_surface}}" }
selected = { fg = "{{on_surface}}", bg = "{{surface_hi}}" }

# : ]]]


# : Completion [[[

[cmp]
border   = { fg = "{{primary}}" }
active   = { fg = "{{on_surface}}", bg = "{{surface_hi}}", bold = true }
inactive = { fg = "{{on_surface_variant}}" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "{{primary}}" }
title   = { fg = "{{primary}}" }
hovered = { fg = "{{accent}}", underline = true }

# : ]]]


# : Help [[[

[help]
border  = { fg = "{{primary}}" }
chord   = { fg = "{{info}}" }
action  = { fg = "{{on_surface}}" }
hovered = { fg = "{{on_surface}}", bg = "{{surface_hi}}", bold = true }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    { mime = "**/image/*",          fg = "{{file_image}}" },
    { mime = "**/{audio,video}/*",  fg = "{{file_media}}" },
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{file_archive}}" },
    { mime = "**/application/{pdf,doc,rtf}", fg = "{{file_doc}}" },

    { mime = "vfs/{absent,stale}", fg = "{{muted}}" },

    { url = "*",  is = "orphan", bg = "{{error}}" },
    { url = "*",  is = "exec",   fg = "{{success}}" },
    { url = "*",  is = "dummy",  bg = "{{error}}" },
    { url = "*/", is = "dummy",  bg = "{{error}}" },

    { url = "*/", fg = "{{accent}}" },
    { url = "*",  fg = "{{on_surface}}" },
]

# : ]]]

# [icon] is left to the yazi preset: icon colours are brand colours,
# and repainting several hundred of them in bloom tones mostly loses information.
