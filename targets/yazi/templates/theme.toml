# Generated by Unclaimed Bloom (Deno template)


# : Manager [[[

[mgr]
cwd = { fg = "{{on_surface}}" }

# Tabs
tab_active   = { fg = "{{on_primary}}",  bg = "{{primary}}",         bold = true }
tab_inactive = { fg = "{{primary}}",     bg = "{{surface_variant}}" }
tab_width    = 1

# Find
find_keyword  = { fg = "{{error}}", bold = true, italic = true, underline = true }
find_position = { fg = "{{error}}", bold = true, italic = true }

# Markers
marker_copied   = { fg = "{{on_primary}}",  bg = "{{copy_marker}}" }
marker_cut      = { fg = "{{on_primary}}",  bg = "{{copy_marker}}" }
marker_marked   = { fg = "{{on_primary}}",  bg = "{{error}}" }
marker_selected = { fg = "{{on_tertiary}}", bg = "{{tertiary}}" }

# Count badges
count_copied   = { fg = "{{on_primary}}",  bg = "{{copy_marker}}" }
count_cut      = { fg = "{{on_primary}}",  bg = "{{copy_marker}}" }
count_selected = { fg = "{{on_tertiary}}", bg = "{{tertiary}}" }

# Border
border_symbol = " "
border_style  = { fg = "{{accent}}" }

# : ]]]


# : Status [[[

[status]
separator_open  = "🭁"
separator_close = "🭠"
separator_style = { bg = "{{on_primary}}", fg = "{{secondary}}" }

[mode]
normal_main = { bg = "{{primary}}",         fg = "{{on_primary}}",         bold = true }
normal_alt  = { bg = "{{surface_variant}}", fg = "{{on_surface_variant}}" }

select_main = { bg = "{{secondary}}",       fg = "{{on_secondary}}",       bold = true }
select_alt  = { bg = "{{surface_variant}}", fg = "{{on_surface_variant}}" }

unset_main  = { bg = "{{tertiary}}",        fg = "{{on_tertiary}}",        bold = true }
unset_alt   = { bg = "{{surface_variant}}", fg = "{{on_surface_variant}}" }

progress_label  = { bold = true }
progress_normal = { fg = "{{primary}}", bg = "{{surface_hi}}" }
progress_error  = { fg = "{{error}}",   bg = "{{surface_hi}}" }

# Permissions
permissions_t = { fg = "{{on_surface_variant}}" }
permissions_r = { fg = "{{perm_r}}" }
permissions_w = { fg = "{{perm_w}}" }
permissions_x = { fg = "{{perm_x}}" }
permissions_s = { fg = "{{primary}}" }

# : ]]]


# : Select [[[

[select]
border = { fg = "{{primary}}" }
active = { fg = "{{tertiary}}", bold = true }

# : ]]]


# : Input [[[

[input]
border = { fg = "{{primary}}" }
value  = { fg = "{{on_surface}}" }

# : ]]]


# : Tabs [[[

[tabs]
active   = { fg = "{{primary}}",   bg = "{{surface_hi}}", bold = true }
inactive = { fg = "{{secondary}}", bg = "{{surface_hi}}" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Completion [[[

[completion]
border = { fg = "{{primary}}", bg = "{{surface_hi}}" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "{{primary}}" }
title   = {}
hovered = { fg = "{{accent}}", underline = true }

# : ]]]


# : Which [[[

[which]
cols = 3
mask            = { bg = "{{surface_hi}}" }
cand            = { fg = "{{primary}}" }
rest            = { fg = "{{on_surface_variant}}" }
desc            = { fg = "{{on_surface}}" }
separator       = " ▶ "
separator_style = { fg = "{{on_surface_variant}}" }

# : ]]]


# : Help [[[

[help]
on     = { fg = "{{on_surface}}" }
run    = { fg = "{{on_surface}}" }
footer = { fg = "{{on_secondary}}", bg = "{{secondary}}" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "{{tertiary}}" }
title_warn  = { fg = "{{primary}}" }
title_error = { fg = "{{error}}" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    { mime = "image/*",                                                                                        fg = "{{file_image}}" },
    { mime = "{audio,video}/*",                                                                                fg = "{{file_media}}" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{file_archive}}" },
    { mime = "application/{pdf,doc,rtf}",                                                                     fg = "{{file_doc}}" },

    { url = "*", is = "orphan", bg = "{{error}}" },
    { url = "*", is = "exec",   fg = "{{on_error}}" },

    { url = "*/", fg = "{{accent}}" },
    { url = "*",  fg = "{{on_surface}}" },
]

# : ]]]
