# Generated by Unclaimed Bloom (Deno template)
# Do not edit this file directly.

$font = SF Pro Text
$font_HM = Neue Machina Ultrabold

$background = {{background|rgba}}
$input_background = {{input_background|rgba}}
$text = {{text|rgba}}
$text_muted = {{text_muted|rgba}}
$accent = {{accent|rgba}}
$warning = {{warning|rgba}}
$danger = {{danger|rgba}}

general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/.cache/hyprlock-current.png
    blur_passes = 0
    color = $background
}

label {
    monitor =
    text = cmd[update:30000] date +"%H"
    color = $accent
    font_size = 175
    font_family = $font_HM
    position = 0, -270
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] date +"%M"
    color = $text
    font_size = 175
    font_family = $font_HM
    position = 0, -470
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%a, %B %d")"
    color = $text
    font_size = 25
    font_family = $font
    position = 0, -150
    halign = center
    valign = top
}

image {
    monitor =
    path = ~/.face1
    size = 150
    border_color = $accent
    border_thickness = 1
    rounding = -1
    position = 0, -75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 10%, 5%
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    outer_color = transparent
    inner_color = $input_background
    font_color = $text

    fade_on_empty = true
    rounding = 100

    placeholder_text = <span foreground="{{text}}"><i>󰌾 Logged in as </i><span foreground="{{accent}}">$USER</span></span>

    hide_input = false
    check_color = $accent
    fail_color = $danger
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $warning

    position = 0, -490
    halign = center
    valign = center
}
