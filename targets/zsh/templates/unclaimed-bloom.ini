; Generated by Unclaimed Bloom / spore.
; Do not edit this file directly unless you enjoy losing arguments with automation.
;
; fast-syntax-highlighting theme. Structure follows the base16 theme (blue commands,
; purple keywords, green strings, muted comments), with q-jmnemonic's finer split
; between commands, builtins, aliases and functions. Applied by `fast-theme` in the
; zsh plant hook; open shells pick it up after `exec zsh`.

[base]
default          = none
unknown-token    = {{danger}},bold
commandseparator = {{operator}}
redirection      = {{operator}}
here-string-tri  = {{warning}}
here-string-text = bg:{{raised_bg}}
here-string-var  = {{variable}},bg:{{raised_bg}}
exec-descriptor  = {{warning}},bold
comment          = {{muted}}
correct-subtle   = {{success}}
incorrect-subtle = {{danger}}
subtle-separator = {{operator}}
subtle-bg        = bg:{{selection_bg}}
secondary        =
recursive-base   = {{fg}}

[command-point]
reserved-word     = {{keyword}}
subcommand        = {{keyword}}
alias             = {{alias}}
suffix-alias      = {{alias}}
global-alias      = {{alias}},bg:{{selection_bg}}
builtin           = {{builtin}}
function          = {{function}}
command           = {{command}}
precommand        = {{keyword}},underline
hashed-command    = {{command}}
single-sq-bracket = {{builtin}}
double-sq-bracket = {{builtin}}
double-paren      = {{keyword}}

[paths]
path          = {{path}}
pathseparator =
path-to-dir   = {{path}},underline
globbing      = {{glob}},bold
globbing-ext  = {{glob}}

[brackets]
paired-bracket  = {{fg}},bg:{{selection_bg}}
bracket-level-1 = {{command}},bold
bracket-level-2 = {{keyword}},bold
bracket-level-3 = {{warning}},bold

[arguments]
single-hyphen-option   = {{option}}
double-hyphen-option   = {{option}}
back-quoted-argument   = none
single-quoted-argument = {{string}}
double-quoted-argument = {{string}}
dollar-quoted-argument = {{string}}

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = {{escape}}
; backslash or $... in "..."
back-or-dollar-double-quoted-argument = {{escape}}

[other]
variable             = {{variable}}
assign               = none
assign-array-bracket = {{keyword}}
history-expansion    = {{keyword}},bold

[math]
mathvar = {{variable}}
mathnum = {{number}}
matherr = {{danger}}

[for-loop]
forvar  = {{variable}}
fornum  = {{number}}
; operator
foroper = {{operator}}
; separator
forsep  = {{keyword}}

[case]
case-input       = {{variable}}
case-parentheses = {{keyword}}
case-condition   = bg:{{selection_bg}}
