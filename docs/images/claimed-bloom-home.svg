<text x="25.2" y="13" fill="#b0b894" textLength="134.4" lengthAdjust="spacingAndGlyphs">  CLAIMED BLOOM</text>
<text x="50.4" y="31" fill="#7c828a" textLength="201.6" lengthAdjust="spacingAndGlyphs">~Every pixel has a past~</text>
<text x="25.2" y="67" fill="#7c828a" textLength="50.4" lengthAdjust="spacingAndGlyphs">[HOME]</text>
<text x="25.2" y="103" fill="#dedfe2" textLength="688.8" lengthAdjust="spacingAndGlyphs">Welcome back. The garden missed you. The garden does not have feelings, but still.</text>
<text x="596.4" y="139" fill="#616875" textLength="571.2" lengthAdjust="spacingAndGlyphs">╭──────────────────────────────────────────────────────────────────╮</text>
<text x="25.2" y="157" fill="#ffffff" textLength="571.2" lengthAdjust="spacingAndGlyphs">   Show...                                                          </text>
<text x="596.4" y="157" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="1159.2" y="157" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="25.2" y="175" fill="#ffffff" textLength="571.2" lengthAdjust="spacingAndGlyphs"> ❯ Check...                                                         </text>
<text x="596.4" y="175" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="613.2" y="175" fill="#dedfe2" textLength="495.6" lengthAdjust="spacingAndGlyphs">Is everything the current theme uses installed and applied?</text>
<text x="1159.2" y="175" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="25.2" y="193" fill="#ffffff" textLength="571.2" lengthAdjust="spacingAndGlyphs">   Do...                                                            </text>
<text x="596.4" y="193" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="1159.2" y="193" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="25.2" y="211" fill="#ffffff" textLength="571.2" lengthAdjust="spacingAndGlyphs">   Complain...                                                      </text>
<text x="596.4" y="211" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="613.2" y="211" fill="#dedfe2" textLength="537.6" lengthAdjust="spacingAndGlyphs">Outdated recipes, profiles, palettes, moods, templates and hooks</text>
<text x="1159.2" y="211" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="25.2" y="229" fill="#ffffff" textLength="571.2" lengthAdjust="spacingAndGlyphs">   Theme...                                                         </text>
<text x="596.4" y="229" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="613.2" y="229" fill="#dedfe2" textLength="537.6" lengthAdjust="spacingAndGlyphs">in use, everything else that is outdated, and what to run to fix</text>
<text x="1159.2" y="229" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="596.4" y="247" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="613.2" y="247" fill="#dedfe2" textLength="25.2" lengthAdjust="spacingAndGlyphs">it.</text>
<text x="1159.2" y="247" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="596.4" y="265" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="1159.2" y="265" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="596.4" y="283" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="613.2" y="283" fill="#7c828a" textLength="394.8" lengthAdjust="spacingAndGlyphs">  ~ Like a smoke detector, but for hex codes. ~</text>
<text x="1159.2" y="283" fill="#616875" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
