<text x="25.2" y="13" fill="#b0b894" textLength="134.4" lengthAdjust="spacingAndGlyphs">  CLAIMED BLOOM</text>
<text x="50.4" y="31" fill="#7c828a" textLength="378.0" lengthAdjust="spacingAndGlyphs">~A terminal is just a garden with fewer bees~</text>
<text x="25.2" y="67" fill="#7c828a" textLength="546.0" lengthAdjust="spacingAndGlyphs">Home &gt; Show... &gt; Profiles &gt; Profile &gt; [DESKTOP-GRAPHITE-BLOOMING]</text>
<text x="25.2" y="103" fill="#dedfe2" textLength="243.6" lengthAdjust="spacingAndGlyphs">Profile:=&gt; what it is made of</text>
