<text x="378.0" y="211" fill="#7c828a" textLength="327.6" lengthAdjust="spacingAndGlyphs">  (used for previews and the workbench)</text>
<text x="1150.8" y="211" fill="#7c828a" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
<text x="33.6" y="229" fill="#7c828a" textLength="8.4" lengthAdjust="spacingAndGlyphs">│</text>
